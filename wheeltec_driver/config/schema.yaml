# Optional because other robot profiles may select a different chassis driver.
# Wheeltec standalone defaults match config/wheeltec_driver.yaml.
schema_version: 1
package: wheeltec_driver
parameters:
  chassis.driver.parameters.usart_port_name:
    type: string
    default: /dev/wheeltec_controller
    description: Wheeltec 串口设备；构造节点后才连接，测试必须注入假串口
  chassis.driver.parameters.serial_baud_rate:
    type: int
    default: 115200
    unit: baud
    range: [1, 4294967295]
    description: 串口波特率
  chassis.driver.parameters.odom_frame_id:
    type: string
    default: odom_combined
    description: 原轮速里程计父帧；不自动改接定位端 TF
  chassis.driver.parameters.robot_frame_id:
    type: string
    default: base_footprint
    description: 原轮速里程计子帧
  chassis.driver.parameters.gyro_frame_id:
    type: string
    default: gyro_link
    description: 可选底盘 IMU 消息帧；与 3 的 IMU 链路独立
  chassis.driver.parameters.odom_x_scale:
    type: float
    default: 1.0
    description: 旧前向轮速校准比例，保持 float 精度
  chassis.driver.parameters.odom_y_scale:
    type: float
    default: 1.0
    description: 旧横向轮速校准比例
  chassis.driver.parameters.odom_z_scale_positive:
    type: float
    default: 1.0
    description: 非负偏航角速度校准比例
  chassis.driver.parameters.odom_z_scale_negative:
    type: float
    default: 1.0
    description: 负偏航角速度校准比例
  chassis.driver.parameters.cmd_timeout_sec:
    type: float
    default: 0.0
    unit: s
    range: [0.0, null]
    description: 驱动命令超时，0 关闭；启用 0.5 需另行实机审核
  chassis.driver.parameters.log_tx_frames:
    type: bool
    default: false
    description: 是否记录非零下行帧；开启后仍需 DEBUG 日志级别
  chassis.driver.parameters.publish_imu:
    type: bool
    default: true
    description: 发布旧底盘 IMU 兼容消息；独立驱动默认保留，David 导航档案关闭
  chassis.driver.parameters.publish_voltage:
    type: bool
    default: true
    description: 发布 PowerVoltage 话题；关闭不影响 diagnostics 中的原始电压

# LSLIDAR C16 (16线 3D) -> 2D LaserScan，喂 slam_toolbox。
#
# 几何来源：ros2_ws/src/david_nav/urdf/david.urdf
#   (david)base_link -> laser_link : xyz="0 -0.352 0.1275"  (IMU<->LiDAR 外参)
#   (david)base_link -> base_footprint: xyz="0 0 -0.25"
#   反算到本包的干净 base_link(=前向落地系,+X前): 雷达 x=+0.352, z=+0.3775
#   (旋转恰为单位阵) => 雷达离地 0.3775m，机身正前方 0.352m。
#   对应 launch 里的静态 base_link->laser_link "0.352 0 0.3775 0 0 0"。
#
# 与 david_nav 那个 p2l(前向180°/scan,给costmap)区分：
#   这里走 360°、独立话题 /scan_slam，专供 slam_toolbox 做全向 scan-match/回环。
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link           # 干净前向系(落地,z=0)，做高度过滤的地面基准
    transform_tolerance: 0.05

    # —— 高度过滤：取地面之上的一层 ——
    # 雷达离地 0.3775m。min_height=0.15 把地面回波/地面附近噪声(z<0.15)滤掉；
    # max_height=1.20 滤天花板/高处杂物，保留墙体主结构做匹配。
    min_height: 0.15
    max_height: 1.20

    # —— 自身点过滤 ——
    # 机身本体由上游 self_filter 节点按 URDF 实测包围盒(box)精确抠除，
    # 不在这里用径向 range_min(那会把雷达正前方空地白白挡掉，见 report §自身点过滤)。
    # 这里 range_min 只滤紧贴传感器的零碎噪声。
    range_min: 0.05
    range_max: 30.0

    # —— 全向 360° ——
    angle_min: -3.14159265
    angle_max:  3.14159265
    angle_increment: 0.0087266     # 0.5° (C16 水平分辨率足够)
    scan_time: 0.10                # C16 ~10Hz
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10

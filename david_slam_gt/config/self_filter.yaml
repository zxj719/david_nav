# self_filter —— 机器人本体 box 过滤参数。
#
# 本体盒来自 david.urdf + meshes/zongzhuang/base_link.STL bbox 实测，
# 反算到本包 base_link(干净前向落地系, +X=前, 地面 z=0)：
#   chassis bbox(CAD): X[右]±0.30  Y[前]-0.30..+0.42  Z[上]-0.146..+0.30
#   轮子(±0.296)也落在 ±0.30 内
#   => base_link 系本体: X[前]-0.30..+0.42  Y[侧]±0.30  Z[高]0..0.45
# 下面在各边留 ~0.03m 余量。雷达@(0.352,0,0.3775) 在盒内偏前上 —— 正因如此
# 不能用径向 range_min(机身在雷达后 0.65m、前仅 0.07m)。
self_filter:
  ros__parameters:
    input_topic: /c16/lslidar_point_cloud
    output_topic: /c16/points_self_filtered
    sensor_xyz: [0.352, 0.0, 0.3775]    # 雷达原点在 base_link 中(纯平移)
    min_x: -0.33
    max_x:  0.45
    min_y: -0.33
    max_y:  0.33
    min_z: -0.10
    max_z:  0.55

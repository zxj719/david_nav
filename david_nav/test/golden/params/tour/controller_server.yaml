/controller_server:
  ros__parameters:
    ? ''
    : position_checker:
        stateful: true
        xy_goal_tolerance: 0.25
    /bond_disable_heartbeat_timeout: true
    FollowPath:
      BaseObstacle:
        class: BaseObstacle
        scale: 0.2
        sum_scores: false
      GoalAlign:
        aggregation_type: last
        class: GoalAlign
        forward_point_distance: 0.2
        scale: 6.0
      GoalDist:
        aggregation_type: last
        class: GoalDist
        scale: 10.0
      Oscillation:
        class: Oscillation
        oscillation_reset_angle: 0.2
        oscillation_reset_dist: 0.05
        oscillation_reset_time: -1.0
        scale: 1.0
        x_only_threshold: 0.05
      PathAlign:
        aggregation_type: last
        class: PathAlign
        forward_point_distance: 0.3
        scale: 12.0
      PathDist:
        aggregation_type: last
        class: PathDist
        scale: 30.0
      acc_lim_theta: 5.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      angular_disengage_threshold: 0.785
      angular_dist_threshold: 0.785
      angular_granularity: 0.025
      closed_loop: true
      critics:
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      debug_trajectory_details: true
      decel_lim_theta: -5.0
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      default_critic_namespaces: []
      discretize_by_time: false
      forward_prune_distance: 2.0
      forward_sampling_distance: 0.5
      include_last_point: true
      limit_vel_cmd_in_traj: false
      linear_granularity: 0.05
      marker_lifetime: 0.1
      max_angular_accel: 3.2
      max_speed_xy: 0.15
      max_vel_theta: 0.5
      max_vel_x: 0.15
      max_vel_y: 0.0
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      min_vel_x: 0.0
      min_vel_y: 0.0
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      prune_distance: 2.0
      prune_plan: true
      publish_cost_grid_pc: false
      publish_evaluation: true
      publish_global_plan: true
      publish_local_plan: true
      publish_trajectories: true
      publish_transformed_plan: true
      rotate_to_goal_heading: false
      rotate_to_heading_angular_vel: 0.55
      short_circuit_trajectory_evaluation: true
      shorten_transformed_plan: true
      sim_time: 1.5
      simulate_ahead_time: 1.0
      time_granularity: 0.5
      trajectory_generator_name: dwb_plugins::StandardTrajectoryGenerator
      transform_tolerance: 1.0
      vtheta_samples: 20
      vx_samples: 5
      vy_samples: 1
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 1.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 6.2832
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.02
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    odom_topic: /lightning/odometry
    progress_checker:
      movement_time_allowance: 20.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugin: progress_checker
    publish_zero_velocity: true
    speed_limit_topic: speed_limit
    use_sim_time: false


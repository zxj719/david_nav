/local_costmap/local_costmap:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    always_send_full_costmap: false
    filters: []
    footprint: '[[0.255, 0.30], [0.255, -0.30], [-0.465, -0.30], [-0.465, 0.30]]'
    footprint_padding: 0.0
    global_frame: odom
    height: 3
    inflation_layer:
      cost_scaling_factor: 10.0
      enabled: true
      inflate_around_unknown: false
      inflate_unknown: false
      inflation_radius: 0.4
      plugin: nav2_costmap_2d::InflationLayer
    lethal_cost_threshold: 100
    map_topic: /map
    observation_sources: ''
    origin_x: 0.0
    origin_y: 0.0
    plugins:
    - static_layer
    - scan_priority_layer
    - inflation_layer
    publish_frequency: 5.0
    resolution: 0.1
    robot_base_frame: base_footprint
    robot_radius: 0.1
    rolling_window: true
    scan_priority_layer:
      debug_markers_enabled: false
      enabled: true
      ground_plane_z_in_base: 0.0
      max_range: 2.5
      min_contiguous_beams: 3
      obstacle_margin_m: 0.12
      plugin: david_nav::ScanPriorityLayer
      require_live_scan: false
      scan_timeout_s: 0.5
      scan_topic: /scan
      sector_max_angle: 0.55
      sector_min_angle: -0.55
    static_layer:
      enabled: true
      footprint_clearing_enabled: false
      map_subscribe_transient_local: true
      map_topic: /map
      plugin: nav2_costmap_2d::StaticLayer
      subscribe_to_updates: false
      transform_tolerance: 0.0
    track_unknown_space: true
    transform_tolerance: 1.0
    trinary_costmap: true
    unknown_cost_value: 255
    update_frequency: 5.0
    use_maximum: false
    use_sim_time: false
    width: 3


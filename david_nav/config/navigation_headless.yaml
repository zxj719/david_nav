default_profile: navigation_no_explore

profiles:
  navigation:
    enable_exploration: true
    enable_scan_bridge: true

  # 与 navigate_semantic_pose_with_debug_bag.sh 的 bringup 保持一致：
  # enable_scan_bridge 默认 false、enable_exploration false。
  navigation_no_explore:
    enable_exploration: false
    enable_scan_bridge: false

cleanup:
  process_matchers:
    - ros2 run lightning run_slam_online
    - ros2 launch david_nav david_auto_explore.launch.py
    - navigation_executor.py
    - static_transform_publisher.*map.*odom
  term_timeout_sec: 10
  kill_timeout_sec: 3

launch:
  use_rviz: false
  nav2_wait_timeout_sec: 120
  slam_start_delay_sec: 5

executor:
  # nav WS v1(2026-07-22):agent server 直接监听根路径,不再有
  # /ws/navigation/executor 子路径;协议默认端口 8101。
  # 地址坑:协议文档里的 ws://192.168.55.1:8101 是 agent 那台 Jetson 自己
  # 的 USB 口地址(每台 Jetson 都有自己的 192.168.55.1,从本机连只会连到
  # 自己)。两机实际走 WiFi 172.16.20.0/22 同网段,agent 监听 0.0.0.0:8101。
  server_uri: ws://192.168.123.186:8101
  server_timeout: 10.0
  heartbeat_interval: 30.0
  reconnect_delay: 3.0
  nav_event_timeout: 15.0
  show_logs: true
  # 2026-08-28 开销压缩：生产默认不录 bag。改前每轮都录，实测 22 分钟写出
  # 5.9GB（4.8MB/s，其中 99.6% 是两个 global costmap 全图话题，已一并移出
  # LIGHT_BAG_TOPICS）。
  #
  # 2026-09-04 改回默认录制。理由：当天导览 lightning 位姿发散（机器人静止而
  # 地图位姿飞出 200m），复盘时只有 chassis.log 的 cmd_vel 可用，没有 /tf、
  # /scan、/lightning/odometry，定不到发散起点；lightning 自己又不写文本日志
  # （~/.ros/log/run_loc_online_*.log 是 0 字节）。没有 bag 等于没有现场。
  #
  # 之所以现在敢默认开：上面那 99.6% 的字节量（两个 global costmap 全图 +
  # /lightning/grid_map）2026-08-28 已经从 LIGHT_BAG_TOPICS 里移掉了，当时只
  # 是顺手把 record_bag 也关了。按同一份实测的 99.6% 折算，瘦身后的清单约为
  # 0.02MB/s 量级（15 分钟导览 ~16MB）—— ⚠ 这是折算值不是实测值，
  # 第一次跑完请用 `du -sh ~/rosbags/<run>/bag` 核对一次。
  #
  # 不想录：命令行加 --no-bag。要全量（含 global costmap 全图 + zstd）：--full-bag。
  # ⚠ --full-bag 仍是 4.8MB/s 量级，别在长导览上用。
  record_bag: true

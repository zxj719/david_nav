default_profile: navigation

profiles:
  navigation:
    enable_exploration: true
    enable_scan_bridge: false
    enable_realsense_scan_bridge: true

  navigation_no_explore:
    enable_exploration: false
    enable_scan_bridge: false
    enable_realsense_scan_bridge: true

  navigation_lidar:
    enable_exploration: true
    enable_scan_bridge: true
    enable_realsense_scan_bridge: false

cleanup:
  process_matchers:
    - ros2 run lightning run_slam_online
    - ros2 launch david_nav david_auto_explore.launch.py
    - navigation_executor.py
    - static_transform_publisher.*map.*odom
  term_timeout_sec: 5
  kill_timeout_sec: 2

launch:
  use_rviz: false
  nav2_wait_timeout_sec: 120
  slam_start_delay_sec: 5

executor:
  server_uri: ws://127.0.0.1:8101/ws/navigation/executor
  server_timeout: 10.0
  heartbeat_interval: 30.0
  reconnect_delay: 3.0
  nav_event_timeout: 15.0
  show_logs: true
  record_bag: false

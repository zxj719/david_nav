# position_controller params (SPEC §4). Defaults; tune on the real chassis.
# Node name is remapped under the launch, so we use a wildcard to be robust.
/**:
  ros__parameters:
    odom_topic: /odom
    cmd_topic: /cmd_vel_position

    control_rate: 20.0        # Hz, must be <= odom rate（2026-06-23 50→20:新底盘 wheeltec
                              # /odom 实测 20Hz,50 会让 2/3 tick 拿到陈旧 pose、微分项加噪）
    v_max: 0.20               # m/s（2026-06-23 0.18→0.20:新底盘开环表征无力矩饱和(扫到 0.5
                              # actual≈cmd),v_max 由控制+上肢稳定性决定而非 plant;用户要求慢
                              # (上肢不稳),取 0.20。闭环直行 −1.4/+2.3cm、零超调,够用）
    w_max: 0.60               # rad/s 旋转峰值（★2026-07-01 标定+速度环阻尼后 0.75→0.60:破缸降到~0.30,
                              # 可慢转;0.60→actual~0.87,配 approach-decel 末端降到 floor 速度→动量滑行小。旧:2026-06-23 0.30→0.75:★新底盘旋转极难起步,
                              # 开环 /odom 表征:持续旋转破缸下限 ≈0.65,可靠(最坏重复)需 ≈0.8;
                              # 0.30 在新底盘上根本转不动。floor min_cmd_w 必须 < 此值。
                              # 旧 0.30 是窄轮距小轮子的标定,新底盘宽轮距(50.5cm)+大轮+caster
                              # 旋转阻力大增。代价:峰值高→停转动量大,靠 rotate_lead 提前停补偿）
    a_max: 0.5                # m/s^2（2026-06-23 保持 0.5:上肢不稳,降 jerk 优先,不放宽）
    alpha_max: 0.8            # rad/s^2，角【加】速上限（2026-06-23 1.0→0.8:角加速柔化,降上肢扰动）
    alpha_decel_max: 0.0      # ★2026-07-01 关(0=对称回退 alpha_max)：实测对本底盘超调无效,见 alpha_approach。
                              # rad/s^2，角【减】速上限（2026-06-30 新增）。
                              # 设想:rotate_lead"提前切零"走 slew 限速,慢 alpha_max 让指令花 ~0.9s 降到 0、
                              # 期间多转 → 拆独立快减速真正切零。仿真单测能演示"切零阶段命令多转"从 ~19°→~3°。
                              # ⚠★2026-07-01 实车 trace 打脸:本底盘超调是【物理动量主导】,切零后滑行 ~49°
                              # 且与快/慢减速基本无关(actual 与 cmd 末端解耦),故此参数对实车超调【几乎无效】。
                              # 早先"实车 19→11 砍半"是 6-23 旧 pyc 未生效 + 逐次方差(11~30°),已更正。
                              # 暂留 2.0(无害、对"能跟随 cmd 的底盘"仍正确;真正超调解法见 alpha_approach)。
    alpha_approach: 0.5       # ★2026-07-01 开(0.5)。速度环阻尼修好后,cmd→actual 可跟随,接近减速真能压慢终点速度→
                              # 动量滑行小→过阻尼可达成。近终点 w<=sqrt(2*0.5*|err|)。上车 trace 调(太慢降,残余散大)。
                              # rad/s^2 角度接近减速。旧注(修firmware前无效):★2026-07-01 关(0)。当时 trace 证明【无效】:
                              # 底盘实际转速≈2.5×指令(cmd0.75→actual~1.9rad/s)、末端 actual 与 cmd 解耦,
                              # 压 cmd 根本不减速→仍滑行~50°。根因在 wheeltec/固件角速度标定,位置环修不了。
                              # infra(core+node+单测)保留,待底盘增益标定好(cmd→actual=1:1)再开。
                              # rad/s^2，角度【接近减速】,近终点 w<=sqrt(2*alpha_approach*|err|)。
                              # 近终点按 w<=sqrt(2*alpha_approach*|err|) 压转速,让整车【以 floor 速度进终点】
                              # (而非满速 1.6rad/s 撞进去),把动量滑行从 ~49° 压到 ~15°(floor 0.55→actual~0.9
                              # →摩擦停车 ~15°)。仿现有线速度 approach_decel。越小越早减速、进得越慢、滑行越少
                              # (代价:转得慢)。0.4≈从 err~40° 开始压。⚠起步值,须上车 trace 调:看到位前 actual
                              # 是否降到 ~floor、滑行是否 ~rotate_lead。与 rotate_lead(预留滑行)+yaw_tol(锁欠转)三者联调。
    approach_decel: 0.15      # m/s^2，接近目标按可刹停距离限速 v<=sqrt(2*decel*(rho-pose_dist_tol))
                              # 越小越早减速、超调越小（0.15≈从 rho~0.5m 开始减速到 tol 处≈0）。2026-06-09 加

    # distance loop — pure P first, then add D; keep Ki small + clamped
    dist.Kp: 1.2
    dist.Ki: 0.0
    dist.Kd: 0.1
    dist.I_max: 0.3           # m*s

    # yaw loop
    yaw.Kp: 2.0
    yaw.Ki: 0.0
    yaw.Kd: 0.15
    yaw.I_max: 0.5

    dist_tol: 0.10            # m, DISTANCE/直线到位容差（2026-06-10 0.40→0.10:直线精度
                              # 本就 ~2cm,末端 floor 0.07 爬行切零滑行 ≈2cm,0.10 富余）
    pose_dist_tol: 0.30       # m, POSE 定点到位容差(2026-06-11 0.40→0.30 同步 goal_dist_tol)——这是"单发 MoveTo/最终 goal"的默认。
                              # waypoint_follower 每段发车前会用 set_parameters 覆盖:
                              # 中间 waypoint 0.8 / 最终 goal 0.4(2026-06-10 分层容差)
    yaw_tol: 0.05             # rad(~3°), ROTATE 原地转容差（★2026-07-01 速度环阻尼后 0.06→0.05:锁住小欠转不回抽。上车 trace 调）。
                              # ↓下面是过阻尼配套时的说明,现已回退,留作底盘增益修好后参考:与 approach-decel:整车以 floor
                              # 速度进终点、预留 lead 停在终点前几度,落在到位带内即 latch,【不再 0.55 回抽】
                              # (回抽=一记 ~15° 猛冲=又冲过)。放宽到略大于"预留欠转角+滑行方差"才不抽。
                              # ⚠2026-07-01 起步值:太小(<欠转量)→回抽抽搐(0.02/0.14 两头都试过失败,详见 rotate_lead)。
                              # 上车 trace 调:锁不住/回抽就加大,残余太散就配合降 alpha_approach 让滑行更稳。
    pose_yaw_tol: 0.14        # rad(≈8°), POSE 终点朝向容差（2026-06-22 0.4→0.14:0.4(23°)
                              # 让终转一进 23° 就 latch、不再微调,终点朝向不收;收紧到
                              # 0.14<goal_yaw_tol(0.17) → 终转持续原地微调到 ~8° 才停,
                              # 末端复查能稳过。中间 waypoint 仍由 follower 动态设回 π=不终转。
                              # 历史:2026-06-10 3.14→0.4）
    # POSE = caster-safe turn-drive-turn（绝不 v+ω 同时）。见 README §4。
    pose_align_tol: 0.10      # rad, "对准够了" 进 DRIVE 的门限
    rotate_lead: 0.10         # rad(~6°)，原地转提前量（★2026-07-01 速度环阻尼后 0.15→0.10:末端 floor 速度低、
                              # 动量滑行~5°,预留~6°停在终点前几度让拖尾补进。旧注:标定后 0.40→0.15:标定后稳态转速低
                              # (cmd0.75→actual~0.54rad/s)、动量滑行小,大 lead 反欠转。上车 trace 调。旧注:过阻尼调参
                              # 因底盘 2.5× 增益全部失败，见 alpha_approach 注）。预留给动量滑行。
                              # 与 alpha_approach 联调:approach-decel 让整车以 floor 速度(actual~0.9)进终点→
                              # 滑行 ~15°,故 lead 预留 ~15-17° 让它停在终点【前】几度(过阻尼/欠转)、拖尾补进。
                              # ⚠2026-07-01 起步值(此前 0.40 是满速撞进的老配;不配 approach-decel 时 lead 再大也没用
                              #   ——满速滑行 ~49°,抬 lead 只会欠转→0.55 回抽抽搐,已实测失败)。上车 trace 调:
                              #   超调应≈0、残余为正(欠转几度);仍冲过→抬 lead 或降 alpha_approach;欠转多→降 lead。
                              # 硬结论备忘:底盘实际~1.6rad/s@cmd0.75(2×增益)、动量主导超调。历史 2026-06-23 0.20→0.40。
    drive_drift_lead: 0.0     # rad（2026-06-10 傍晚 0.3→0 关闭:中间点松容差吃掉甩偏 +
                              # 段段重瞄 + 末端闭环复查兜底后,预瞄收益小,小转角段反被
                              # 白偏 17°。代价:进场点段可能多一次重逼近。要回退就设 0.3)
                              # ALIGN 预留的"起步甩偏角"，抵消直行起步 caster 甩偏。
                              # 符号自动跟随 ALIGN 转向（转向决定脚轮甩向），所以这里
                              # 只标一个【幅值+底盘L/R惯例符号】，左右转都自适应。0=关。
                              # 标定：固定去 (0.5,0.5) 跑，调到一段直行就 arrived(无 reapproach)
    drive_overshoot_margin: 0.05  # m，直行冲过最近点这么多 → 判 mis-aim，停下重逼近
    pose_max_cycles: 4        # 最大重逼近次数
    arrival_cycles: 10        # consecutive in-tolerance ticks to latch arrival
    v_stop: 0.01              # m/s, "stopped" threshold (distance/pose)
    w_stop: 0.05              # rad/s, "stopped" threshold (rotate/final-turn)

    # 60s（不是 30）：POSE stop-and-turn 在这台慢底盘上多段 + 每段停稳，单次定点
    # 实测 ~24s，回中（更大转角）更久；30s 会把回中/远距离 POSE 误判超时。
    goal_timeout: 60.0        # s
    odom_timeout: 0.5         # s, mid-run odom-loss guard（0.3→0.5：容忍 odom 短暂抖动；
                              # 真要稳，测位置环时别开 SLAM/雷达/IMU，只留 wheeltec）
    # 启动时等第一帧 odom 的宽限（新进程 DDS 发现竞速 / 底盘还在起）。--no-confirm
    # 连发目标时，控制器刚 spawn 还没发现 wheeltec 的 /odom 就被打目标 → 否则会
    # "no /odom yet" 秒 abort（2026-06-09 实测全项 0s 失败的根因）。
    odom_start_grace: 5.0     # s

    # +cmd should move odom forward. If odom goes backward on +cmd, set true.
    invert_linear: false

    # Deadzone floor — REQUIRED on this chassis (治标). Break-away feedforward
    # is NOT done in firmware (it's a 治本方向, see PID调参报告_20260608 §1/§6).
    # /cmd_vel_position bypasses david_move's 0.20/0.35 lift, so the floor lives
    # here. 2026-06-10 单向扫描实测(test1_deadzone,每档先甩定脚轮):
    #   直行 顺脚轮 ≤0.03 / 逆脚轮 0.06 → min_cmd_v = 0.06+0.01
    #   旋转 转后 0.18 / 直行后(ALIGN 真实工况,最坏) 0.30 → min_cmd_w = 0.30+0.02
    # 旧值 0.18 只覆盖最好情况,正是 ALIGN 卡顿的原因。floor 必须 < 对应 max
    # (核心层会在启动时校验,floor>max 直接报错)。
    min_cmd_v: 0.14           # m/s（2026-06-23 0.07→0.14:新底盘开环表征,0.10 不可靠(1/3卡),
                              # 0.12 三发都动但仅 3cm/s 爬行,0.14 才有可靠真实推进(0.15+)。旧 0.07 会卡死）
    min_cmd_w: 0.40           # rad/s 旋转破缸下限（★2026-07-01 速度环阻尼后重扫:破缸降到≈0.30(最坏仍动),
                              # 0.40 留裕量→actual~0.4rad/s,末端 floor 速度低→动量滑行~5°(过阻尼关键)。旧注:标定后重扫:0.55→0.65。odom 标定去掉过驱后
                              # 破缸上升,开环 chassis_characterize 实测下限≈0.60(最坏仍动),0.65 留裕量。旧0.55 起步 stall~0.9s。
                              # 历史 2026-06-23 0.24→0.55:★重跑死区扫描的结论。
                              # 新底盘开环 /odom 表征:0.40-0.50 仅偶发 lurch 后立即 stall(中位≈0),
                              # 0.65 才持续转;0.24 在新底盘上完全转不动。0.55 floor + rotate_lead
                              # 提前停,保证 ALIGN/微调每拍都真转;太低则 ALIGN 卡死(旧坑重现)。
                              # 方向不对称(直行后顺/逆 caster 一侧更难),取偏稳的下限）

    robot_frame: base_footprint

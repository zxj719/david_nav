controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints:
      - AR5-5_08L-W4C4A6-ZY2_joint_1
      - AR5-5_08L-W4C4A6-ZY2_joint_2
      - AR5-5_08L-W4C4A6-ZY2_joint_3
      - AR5-5_08L-W4C4A6-ZY2_joint_4
      - AR5-5_08L-W4C4A6-ZY2_joint_5
      - AR5-5_08L-W4C4A6-ZY2_joint_6
      - AR5-5_08L-W4C4A6-ZY2_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

right_arm_controller:
  ros__parameters:
    joints:
      - AR5-5_08R-W4C4A6-ZY2_joint_1
      - AR5-5_08R-W4C4A6-ZY2_joint_2
      - AR5-5_08R-W4C4A6-ZY2_joint_3
      - AR5-5_08R-W4C4A6-ZY2_joint_4
      - AR5-5_08R-W4C4A6-ZY2_joint_5
      - AR5-5_08R-W4C4A6-ZY2_joint_6
      - AR5-5_08R-W4C4A6-ZY2_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

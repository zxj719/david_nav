# David robot profile (refactor plan §12.2).
#
# This profile is the single source of robot-specific runtime values. Mode
# differences belong in modes/*.yaml and site data in sites/<site>/.
schema_version: 1

robot:
  name: david
  description: 70 kg 差速底盘 + 从动脚轮，双臂人形

kinematics:
  type: diff_drive

frames:
  map: map
  odom: odom
  # base_link 与 base_footprint 是不同的帧，禁止合并（位置关系见 URDF）
  nav_base: base_footprint          # Nav2 / 入位 / 代价图 / BT
  body: base_link                   # 机身本体帧（lightning 发布）
  slam_base: base                   # SLAM 内部帧，导航禁用
  poi_capture: base_link            # 采点帧；与 nav_base 不同时 validate 告警

footprint: [[0.255, 0.30], [0.255, -0.30], [-0.465, -0.30], [-0.465, 0.30]]

limits:
  max_vel_x: 0.15
  max_vel_theta: 0.50
  max_reverse_vel: 0.20             # TODO-E1 新脱困策略使用

goal:                               # 到点判定；精确入位等模式在 modes/ 中收紧
  xy_tolerance: 0.30                # 目标检查器与 DWB 两处取同一值
  yaw_tolerance: 6.2832             # 2π：不约束朝向

dock:                               # 精准入位（= 生产 precise 启动参数的默认值）
  approach_dist: 0.5                # m，阶段 1 预备点沿目标航向后退的距离
  xy_ok: 0.25                       # m，入位达标位置阈值；与 Nav2 的到点容差 goal.xy_tolerance 是两回事
  yaw_ok: 0.4363                    # rad（25°），达标朝向阈值
  max_yaw_retries: 0                # 朝向不达标不再重试（最小可执行原地转角约 13.6°）

chassis:
  cmd_topic: /cmd_vel
  odom_topic: /odom
  odom_frame: odom_combined         # 轮式积分父帧，与定位 frames.odom 独立
  adapter:                          # = 导航时 david_move 的生效参数
    input_topic: cmd_vel_smoothed
    hard_max_linear_x: 0.20
    hard_max_angular_z: 0.60
    min_linear_x: 0.0
    min_angular_z: 0.0
    min_stationary_angular_z: 0.55
    stationary_angular_threshold: 0.025
    cmd_timeout_sec: 2.0            # L2 后 1.0
    publish_hz: 50.0                # L3 后 20
  driver:
    package: wheeltec_driver
    executable: wheeltec_driver_node
    parameters:
      usart_port_name: /dev/wheeltec_controller
      serial_baud_rate: 115200
      odom_frame_id: odom_combined
      robot_frame_id: base_footprint
      gyro_frame_id: gyro_link
      odom_x_scale: 1.0
      odom_y_scale: 1.0
      odom_z_scale_positive: 1.0
      odom_z_scale_negative: 1.0
      cmd_timeout_sec: 0.0          # D3：实机冒烟后改 0.5
      log_tx_frames: false
      publish_imu: false           # 用户明确：IMU 由 3/uslam 提供，导航不重复发布
      publish_voltage: true
    detect_patterns:
      - wheeltec_robot_node
      - wheeltec_driver_node
      - twist_transform
      - launch turn_on_wheeltec_robot
    startup_delay_sec: 3.0
    max_restarts: 1

teleop:
  layout: wasd
  tty_device: /dev/tty
  cmd_topic: cmd_vel_safe
  linear_speed: 0.20
  angular_speed: 0.35
  linear_deadzone: 0.20
  angular_deadzone: 0.35
  max_linear_x: 0.20
  max_angular_z: 0.50
  publish_hz: 20.0
  key_timeout_sec: 0.40

localization:
  provider: lightning
  odom_topic: /lightning/loc/odometry          # alias 3 实际发布
  aligned_cloud_topic: /lightning/loc/aligned_scan
  process_name: run_loc_online
  config_flags: ['--config']
  log_globs:
    - '~/.ros/log/run_loc_online_{pid}_*.log'
    - '/home/agx/lightning_ws_new/src/embodied_intelligence/log/david001_loc_launch/*.out'

nav2:
  odom_topic: /lightning/odometry   # Nav2 现接线（alias 3 不发布该话题）；等值渲染保留，是否切换见 TODO-O1
  map_topic: /map                   # 代价图静态层实际订阅

localization_health:
  max_tf_age_sec: 0.5
  max_divergence_m: 1.0
  divergence_window_sec: 2.0
  action: warn

startup:
  nav_ready_timeout_sec: 120.0
executor:
  reconnect_delay_sec: 3.0
  # Legacy standalone executor defaults; site/CLI can override the store path.
  # POI capture uses frames.poi_capture, odometry keeps nav2.odom_topic (TODO-O1).
  poi_store_file: ~/.ros/david_nav/poi_store.yaml
  grid_map_topic: /lightning/grid_map

reactive:
  # Existing behavior, including lateral escape and the 0.25 m/s recovery
  # speeds, is preserved. A new differential-drive escape policy is TODO-E1.
  escape: {longitudinal_speed: 0.25, lateral_speed: 0.20}
  embedded_backup: {distance: 0.35, speed: 0.25}
  recovery:
    backup_distance: 0.30
    backup_speed: 0.15
    spin_distance: 1.57
    passed_goal_radius: 0.7

platform:
  jetson: true
  maxn: true
  jetson_clocks: true

preflight:
  kill_patterns:
    - navigation_executor.py
    - launch david_nav 2d_david_nav2_bringup
    - launch david_nav precise_nav_bringup
    - launch nav_bringup nav.launch.py
    - nav2_controller/controller_server
    - nav2_planner/planner_server
    - nav2_smoother/smoother_server
    - nav2_behaviors/behavior_server
    - nav2_bt_navigator/bt_navigator
    - nav2_waypoint_follower/waypoint_follower
    - nav2_velocity_smoother/velocity_smoother
    - nav2_lifecycle_manager/lifecycle_manager
    - lib/david_cmd/david_move
    - lib/chassis_adapter/chassis_adapter
    - lib/david_nav/dock_navigator
  foreign_patterns:
    - moveit_ros_move_group/move_group
    - moveit_simple_controller_manager
    - david_sdk_bridge/lib/david_sdk_bridge/arm_node
  kill_foreign_stacks: false

record:
  # Keep light recording bounded; do not add full global maps or localization clouds here.
  light_topics:
    - /tf
    - /tf_static
    - /rosout
    - /cmd_vel
    - /cmd_vel_nav
    - /cmd_vel_safe
    - /cmd_control_command
    - /map
    - /lightning/odometry
    - /local_costmap/costmap
    - /local_costmap/costmap_raw
    - /local_costmap/published_footprint
    - /global_costmap/costmap_updates
    - /global_costmap/published_footprint
    - /navigate_to_pose/_action/status
    - /navigate_to_pose/_action/feedback
    - /navigate_to_pose/_action/result
    - /plan
  full_topics:
    - /tf
    - /tf_static
    - /parameter_events
    - /rosout
    - /cmd_vel
    - /cmd_vel_nav
    - /cmd_vel_safe
    - /cmd_control_command
    - /map
    - /lightning/odometry
    - /lightning/grid_map
    - /odommodestate
    - /sportmodestate
    - /lf/odommodestate
    - /lf/sportmodestate
    - /planner_map
    - /gridmap
    - /collision_clouds
    - /pre_collision_clouds
    - /safe_clouds
    - /warning_clouds
    - /utlidar/cloud_livox_mid360
    - /utlidar/imu_livox_mid360
  full_regex: '^/((local_costmap|global_costmap|frontier|explore|collision_monitor|navigate_to_pose|navigate_through_poses|plan|goal_pose|clicked_point|behavior_tree_log|map_live_ready)(/.*)?)$'
  full_include_hidden: true
  full_include_unpublished: true
  full_compression: zstd
  max_cache_size_bytes: 104857600
  monitor_topics: [/cmd_vel, /cmd_vel_smoothed, /odom, /lightning/loc/odometry]
  monitor_period_sec: 5.0
  storage: sqlite3

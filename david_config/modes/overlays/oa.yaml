# navrun up --OA 的最小叠加：只接通一条局部障碍数据链。
#
# Lightning 的 aligned_scan 直接交给标准 ObstacleLayer。这里不再启动
# 不启动点云转换器，也不加载第二套自定义代价层，避免同一观测被重复标记和清除。
# 0.3 m blind 属于 Lightning 配置，不在导航侧重复表达。
schema_version: 1
mode: oa
description: 使用 Lightning 对齐点云的标准局部障碍层

nav2_overrides:
  local_costmap/local_costmap/ros__parameters/plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
  local_costmap/local_costmap/ros__parameters/obstacle_layer:
    observation_sources: aligned_cloud
    aligned_cloud:
      topic: /lightning/loc/aligned_scan
      # aligned_scan 的 header.frame_id 是 map；清除射线的真实原点跟随机器人。
      # 这是当前 Lightning 接口的过渡适配。后续实时避障点云应保留真实雷达 frame。
      sensor_frame: base_footprint
      data_type: PointCloud2
      marking: true
      clearing: true
      # 当前 odom 中地面约为 -0.682 m，以下窗口约对应离地 0.13～1.03 m。
      min_obstacle_height: -0.55
      max_obstacle_height: 0.35
      obstacle_min_range: 0.2
      obstacle_max_range: 2.5
      raytrace_min_range: 0.2
      raytrace_max_range: 3.0

# Precise mode overlay (refactor plan §12.2): the final stage of two-stage docking.
#
# This overlay only tightens goal handling on the shared Nav2 base.
schema_version: 1
mode: precise
description: 精确入位：到点位置与朝向收紧，末端原地转到目标朝向
profile:
  goal:
    xy_tolerance: 0.10
    yaw_tolerance: 0.4363           # 25°
nav2_overrides:
  # A yaw tolerance below 2π needs the RotateToGoal critic; without it DWB
  # never turns to the goal heading (plan §12.4).
  controller_server/ros__parameters/FollowPath/critics:
    - RotateToGoal
    - Oscillation
    - BaseObstacle
    - GoalAlign
    - PathAlign
    - PathDist
    - GoalDist

# Explicit experiment only; never selected by the default five mode names.
schema_version: 1
mode: precise
description: L3 opt-in experiment; requires hardware A/B before deployment
profile:
  goal:
    xy_tolerance: 0.10
    yaw_tolerance: 0.4363
  chassis:
    adapter:
      publish_hz: 20.0
nav2_overrides:
  controller_server/ros__parameters/FollowPath/critics:
    - RotateToGoal
    - Oscillation
    - BaseObstacle
    - GoalAlign
    - PathAlign
    - PathDist
    - GoalDist

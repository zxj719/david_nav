# Explicit experiment only; never selected by the default five mode names.
schema_version: 1
mode: precise
description: L2_L3 opt-in experiment; requires hardware A/B before deployment
profile:
  goal:
    xy_tolerance: 0.10
    yaw_tolerance: 0.4363
  nav2:
    velocity_smoother:
      enabled: false
  chassis:
    adapter:
      cmd_timeout_sec: 1.0
      hard_max_angular_z: 0.60
      publish_hz: 20.0
nav2_overrides:
  behavior_server/ros__parameters/max_rotational_vel: 0.5
  controller_server/ros__parameters/FollowPath/critics:
    - RotateToGoal
    - Oscillation
    - BaseObstacle
    - GoalAlign
    - PathAlign
    - PathDist
    - GoalDist

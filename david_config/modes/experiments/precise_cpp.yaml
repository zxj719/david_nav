# Explicit C++ adapter experiment; Python remains the default.
schema_version: 1
mode: precise
description: C++ adapter opt-in; hardware A/B required before production selection
profile:
  chassis:
    adapter:
      implementation: cpp
  goal:
    xy_tolerance: 0.10
    yaw_tolerance: 0.4363
nav2_overrides:
  controller_server/ros__parameters/FollowPath/critics:
    - RotateToGoal
    - Oscillation
    - BaseObstacle
    - GoalAlign
    - PathAlign
    - PathDist
    - GoalDist

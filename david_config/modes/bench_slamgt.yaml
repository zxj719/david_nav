# Controller bench overlay with 2D SLAM ground truth (refactor plan §12.2, §12.5).
#
# test/test_modes.py renders it and compares the result with
# david_nav/config/nav2_params_2d_bench_slamgt.yaml. Tuning found on the bench
# comes back to the profile as a commit to this file (plan §12.5).
schema_version: 1
mode: bench_slamgt
description: 控制器调参台架：slam_gt 定位、轮式里程计，到点位置与朝向收紧
profile:
  nav2:
    odom_topic: /odom
    scan_topic: /scan_slam
    map_topic: /map
  goal:
    xy_tolerance: 0.10
    yaw_tolerance: 0.087            # 5°
nav2_overrides:
  # nav2_base holds the effective tour/precise pass-through values. The bench
  # keeps the shaping and live-scan requirements of its existing parameter file.
  local_costmap/local_costmap/ros__parameters/scan_priority_layer/require_live_scan: true
  velocity_smoother/ros__parameters/feedback: CLOSED_LOOP
  velocity_smoother/ros__parameters/smoothing_frequency: 10.0
  velocity_smoother/ros__parameters/max_accel: [2.5, 0.0, 5.0]
  velocity_smoother/ros__parameters/max_decel: [-2.5, 0.0, -5.0]
  # The bench file predates the 2026-08-28 trim of the tour plugin list and
  # still loads the full Nav2 set.
  bt_navigator/ros__parameters/plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - david_robot_embedded_in_obstacle_condition_bt_node
    - david_escape_obstacle_action_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
  controller_server/ros__parameters/FollowPath/critics:
    - RotateToGoal
    - Oscillation
    - BaseObstacle
    - GoalAlign
    - PathAlign
    - PathDist
    - GoalDist
  controller_server/ros__parameters/FollowPath/RotateToGoal.scale: 1.0
  controller_server/ros__parameters/FollowPath/RotateToGoal.slowing_factor: 2.0
  controller_server/ros__parameters/FollowPath/RotateToGoal.lookahead_time: -1.0
  # The bench records the global costmap, so it is published in full and often.
  global_costmap/global_costmap/ros__parameters/update_frequency: 5.0
  global_costmap/global_costmap/ros__parameters/publish_frequency: 5.0
  global_costmap/global_costmap/ros__parameters/always_send_full_costmap: true

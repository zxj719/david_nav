david_move:
  ros__parameters:
    input_cmd_vel_topic: cmd_vel_safe
    output_cmd_vel_topic: /cmd_vel
    cmd_vel_timeout: 2.0
    min_linear_x: 0.20
    max_linear_x: 0.20
    min_angular_z: 0.20
    min_stationary_angular_z: 0.35
    stationary_angular_threshold: 0.025
    max_angular_z: 0.50
    publish_hz: 50.0

david_keyboard:
  ros__parameters:
    cmd_vel_topic: cmd_vel_safe
    linear_speed: 0.20
    angular_speed: 0.35
    linear_deadzone: 0.20
    angular_deadzone: 0.35
    max_linear_x: 0.20
    max_angular_z: 0.50
    publish_hz: 20.0
    key_timeout: 0.40

wheeltec_base_eval:
  ros__parameters:
    cmd_vel_topic: cmd_vel_safe
    odom_topic: /odom
    publish_hz: 20.0
    linear_speed: 0.10
    angular_speed: 0.30
    target_distance: 0.25
    target_yaw_deg: 60.0
    segment_timeout: 8.0
    odom_timeout: 0.50
    odom_wait_timeout: 5.0
    linear_twist_threshold: 0.02
    angular_twist_threshold: 0.03
    distance_tolerance: 0.05
    yaw_tolerance_deg: 5.0
    reset_distance_tolerance: 0.06
    reset_yaw_tolerance_deg: 8.0
    reverse_drift_limit: 0.03

wheeltec_micro_eval:
  ros__parameters:
    cmd_vel_topic: cmd_vel_safe
    forwarded_cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    imu_topic: /imu/data_raw
    publish_hz: 50.0
    baseline_duration: 2.0
    probe_duration: 0.30
    settle_duration: 0.65
    hard_distance_limit: 0.10
    soft_distance_limit: 0.06
    odom_timeout: 0.50
    imu_timeout: 0.50
    wait_timeout: 8.0
    linear_levels: [0.02, 0.035, 0.05, 0.065, 0.08, 0.10]
    angular_levels: [0.05, 0.08, 0.12, 0.16, 0.20, 0.25]
    max_linear_command: 0.10
    max_angular_command: 0.25
    odom_vx_threshold: 0.015
    odom_wz_threshold: 0.025
    move_distance_threshold: 0.003
    imu_accel_delta_threshold: 0.08
    imu_gyro_delta_threshold: 0.025

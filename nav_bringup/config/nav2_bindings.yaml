# Binding table of nav2_base.yaml (refactor plan §12.3).
#
# Each entry names a robot profile key and every Nav2 parameter that takes its
# value, so parameters that must be equal are equal by construction. Every
# listed parameter holds the marker <bind:KEY> in nav2_base.yaml and every
# marker is listed here; navcfg render refuses to render otherwise. Parameter
# paths separate names with "/" because Nav2 parameter names contain dots.
schema_version: 1
bindings:
  frames.map:
    - bt_navigator/ros__parameters/global_frame
    - global_costmap/global_costmap/ros__parameters/global_frame
    - recoveries_server/ros__parameters/global_frame        # inactive section, see nav2_base.yaml
  frames.odom:
    # behavior_server must work in the frame of the local costmap (plan §12.4)
    - controller_server/ros__parameters/global_frame
    - local_costmap/local_costmap/ros__parameters/global_frame
    - behavior_server/ros__parameters/global_frame
  frames.nav_base:
    - bt_navigator/ros__parameters/robot_base_frame
    - local_costmap/local_costmap/ros__parameters/robot_base_frame
    - global_costmap/global_costmap/ros__parameters/robot_base_frame
    - behavior_server/ros__parameters/robot_base_frame
    - recoveries_server/ros__parameters/robot_base_frame    # inactive section
  footprint:
    format: footprint_string
    paths:
      - local_costmap/local_costmap/ros__parameters/footprint
      - global_costmap/global_costmap/ros__parameters/footprint
  limits.max_vel_x:
    # DWB drops every sample faster than max_speed_xy, so both must be equal
    - controller_server/ros__parameters/FollowPath/max_vel_x
    - controller_server/ros__parameters/FollowPath/max_speed_xy
  limits.max_vel_theta:
    - controller_server/ros__parameters/FollowPath/max_vel_theta
  goal.xy_tolerance:
    - controller_server/ros__parameters/general_goal_checker/xy_goal_tolerance
    - controller_server/ros__parameters/FollowPath/xy_goal_tolerance
  goal.yaw_tolerance:
    - controller_server/ros__parameters/general_goal_checker/yaw_goal_tolerance
  nav2.odom_topic:
    - bt_navigator/ros__parameters/odom_topic
    - controller_server/ros__parameters/odom_topic
  nav2.scan_topic:
    - local_costmap/local_costmap/ros__parameters/scan_priority_layer/scan_topic
    - local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/topic
    - global_costmap/global_costmap/ros__parameters/obstacle_layer/scan/topic
  nav2.map_topic:
    - local_costmap/local_costmap/ros__parameters/static_layer/map_topic
    - global_costmap/global_costmap/ros__parameters/static_layer/map_topic
  chassis.odom_topic:
    - velocity_smoother/ros__parameters/odom_topic

# Robot profile keys consumed by nav_bringup (navrun up, run recorder, navcfg render).
# Format: nav_bringup/navcfg/schema.py. Values for a robot live in its
# <robot>_config package; defaults here are robot independent and conservative.
# Keys bound in config/nav2_bindings.yaml are required: they have no robot
# independent value.
schema_version: 1
package: nav_bringup
parameters:
  nav2.velocity_smoother.enabled:
    type: bool
    default: true
    description: 保留速度平滑器；L2 实验显式关闭后 Nav2 直连适配层输入，须同时迁移恢复限速与超时
  startup.nav_ready_timeout_sec:
    type: float
    default: 120.0
    unit: s
    range: [0.0, null]
    description: 统一入口等待 Nav2 action server 的最长时间，运行时严格大于零；不限制人工定位等待
  executor.reconnect_delay_sec:
    type: float
    default: 3.0
    unit: s
    range: [0.0, null]
    description: 旧 WS 执行器重连等待，映射 --reconnect-delay；其余协议默认保持原值
  frames.map:
    type: string
    required: true
    description: 全局地图帧（Nav2 BT、全局代价图）
  frames.odom:
    type: string
    required: true
    description: 里程计帧（控制器、局部代价图与恢复行为，三处必须一致）
  frames.nav_base:
    type: string
    required: true
    description: 导航基准帧（旋转中心；Nav2、代价图、入位使用）；与机身帧分开书写，不得混用
  footprint:
    type: list
    unit: m
    required: true
    description: 机器人轮廓多边形 [[x, y], ...]，在 frames.nav_base 下表达，至少三个点
  limits.max_vel_x:
    type: float
    unit: m/s
    required: true
    range: [0.0, null]
    description: 导航最大前进线速度（DWB max_vel_x 与 max_speed_xy 取同一值）
  limits.max_vel_theta:
    type: float
    unit: rad/s
    required: true
    range: [0.0, null]
    description: 导航最大角速度（DWB max_vel_theta）
  goal.xy_tolerance:
    type: float
    unit: m
    required: true
    range: [0.0, null]
    description: 到点位置容差（目标检查器与 DWB 两处取同一值）
  goal.yaw_tolerance:
    type: float
    unit: rad
    required: true
    range: [0.0, 6.2832]
    description: 到点朝向容差；6.2832（2π）表示不约束朝向，小于 2π 时控制器 critics 必须含 RotateToGoal
  nav2.odom_topic:
    type: string
    required: true
    description: Nav2 BT 与控制器订阅的里程计话题
  nav2.map_topic:
    type: string
    required: true
    description: 代价图静态层订阅的栅格地图话题（启动文件可能改写，见 PROGRESS P2.4）
  dock.approach_dist:
    type: float
    unit: m
    default: 0.5
    range: [0.0, null]
    description: 精准入位阶段 1 的预备点沿目标航向后退的距离
  dock.xy_ok:
    type: float
    unit: m
    default: 0.10
    range: [0.0, null]
    description: 精准入位的达标位置阈值；与 Nav2 的到点容差 goal.xy_tolerance 相互独立
  dock.yaw_ok:
    type: float
    unit: rad
    default: 0.4363
    range: [0.0, 6.2832]
    description: 精准入位的达标朝向阈值
  dock.max_yaw_retries:
    type: int
    default: 0
    range: [0, 10]
    description: 朝向不达标时补转的次数；0 表示不补转
  chassis.odom_topic:
    type: string
    required: true
    description: 底盘轮式里程计话题（速度平滑器闭环反馈）
  chassis.driver.executable:
    type: string
    default: null
    description: 驱动包内的可执行文件名；navrun 准备运行参数时必须显式提供，不从机器人名字猜测
  platform.jetson:
    type: bool
    default: false
    description: 主机是 NVIDIA Jetson；为 true 时 navrun up 才处理功耗模式与 jetson_clocks
  platform.maxn:
    type: bool
    default: false
    description: 启动前把 Jetson 切到最高功耗模式（nvpmodel MAXN）；需要 platform.jetson 为 true
  platform.jetson_clocks:
    type: bool
    default: false
    description: 启动前运行 jetson_clocks 固定 CPU/GPU 频率；需要 platform.jetson 为 true
  platform.maxn_mode_id:
    type: int
    default: 0
    range: [0, null]
    description: nvpmodel 的 MAXN 模式编号；David 旧入口为 0，不同 Jetson 板型可在档案覆盖
  platform.command_timeout_sec:
    type: float
    unit: s
    default: 30.0
    range: [0.001, null]
    description: 每条平台命令的等待期限；无密码、无交互，失败后停止后续平台步骤
  preflight.kill_patterns:
    type: list
    items: string
    default: []
    description: 启动前结束的本导航栈残留进程的命令行匹配式
  preflight.foreign_patterns:
    type: list
    items: string
    default: []
    description: 机械臂或 MoveIt 等外部栈的程序匹配式；默认只告警，即使也命中 kill_patterns
  preflight.protected_patterns:
    type: list
    items: string
    default: []
    description: 永不清理的外部程序匹配式；额外保护其启动分支和祖先，定位 process_name 总是自动保护
  preflight.kill_foreign_stacks:
    type: bool
    default: false
    description: 是否结束不属于本导航栈的其它 ROS 栈进程；默认不动
  localization.process_name:
    type: string
    default: null
    description: 单独启动的定位进程的可执行文件名；设置后运行记录会关联它（pid、启动时间、命令行、配置 sha256、日志摘录）
  localization.config_flags:
    type: list
    items: string
    default: ['--config']
    description: 定位命令行中值为配置文件路径的参数，用于记录配置 sha256
  localization.log_globs:
    type: list
    items: string
    default: []
    description: 定位日志文件通配符（{pid} 替换为进程号，~ 展开）；运行结束时把本次运行期间新增的内容摘录到 logs/loc/
  record.light_topics:
    type: list
    items: string
    default: []
    description: 每次运行默认录制的轻量话题；为空则不录包
  record.monitor_topics:
    type: list
    items: string
    default: []
    description: navrun monitor 统计频率与发布者数的话题；只选轻量话题（大点云等仍有传输开销）
  record.full_topics:
    type: list
    items: string
    default: []
    description: full 模式的显式话题清单；与 full_regex 合并，不能都为空，不自动改成全部话题
  record.full_regex:
    type: string
    default: ''
    description: full 模式额外的话题正则，light 模式不使用
  record.full_include_hidden:
    type: bool
    default: false
    description: full 模式是否包含匹配选择器的隐藏话题；David 保留旧 full-bag 行为
  record.full_include_unpublished:
    type: bool
    default: false
    description: full 模式是否包含未发布的话题；David 保留旧 full-bag 行为
  record.full_compression:
    type: string
    choices: [none, zstd]
    default: none
    description: full 模式是否使用 zstd 文件压缩；始终使用 sqlite3，不安装 MCAP
  record.max_cache_size_bytes:
    type: int
    unit: bytes
    range: [0, null]
    default: 104857600
    description: rosbag2 最大消息缓存；默认保留旧入口的 100 MiB
  record.monitor_period_sec:
    type: float
    unit: s
    default: 5.0
    range: [1.0, 60.0]
    description: navrun monitor 写一行 metrics/topics.csv 的间隔（默认 5 s，即 0.2 Hz）
  record.storage:
    type: string
    default: sqlite3
    choices: [sqlite3]
    description: rosbag2 存储插件；mcap 插件未安装（TODO）

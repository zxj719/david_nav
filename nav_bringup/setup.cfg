[develop]
script_dir=$base/lib/nav_bringup
[install]
install_scripts=$base/lib/nav_bringup

[flake8]
# Same settings as ament_flake8 (Humble) so local runs match colcon test.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
max-line-length = 99

schema_version: 1
package: chassis_teleop
parameters:
  teleop.cmd_topic:
    type: string
    default: cmd_vel_safe
    description: 键盘输出话题，应接模式的 adapter 输入，不直连驱动；节点 cmd_vel_topic
  teleop.layout:
    type: string
    default: wasd
    choices: [wasd, uiojkl]
    description: 键位布局；两种均支持方向键、空格/k 停车和 q 退出，没有全向或加速键
  teleop.tty_device:
    type: string
    default: /dev/tty
    description: 单独打开的交互终端，独立于 launch 的 stdin；只用于终端，不能指向底盘串口
  teleop.linear_speed:
    type: float
    default: 0.20
    range: [0.0, null]
    unit: m/s
    description: 当前前进/后退档位；经过死区抬升和上限钳位
  teleop.angular_speed:
    type: float
    default: 0.35
    range: [0.0, null]
    unit: rad/s
    description: 当前转向档位；经过死区抬升和上限钳位
  teleop.linear_deadzone:
    type: float
    default: 0.20
    range: [0.0, null]
    unit: m/s
    description: 键盘非零线速度地板，实际不超过键盘 max_linear_x
  teleop.angular_deadzone:
    type: float
    default: 0.35
    range: [0.0, null]
    unit: rad/s
    description: 键盘非零角速度地板，实际不超过键盘 max_angular_z
  teleop.max_linear_x:
    type: float
    default: 0.20
    range: [0.0, null]
    unit: m/s
    description: 键盘线速度上限；档案校验要求不超过 adapter 硬限
  teleop.max_angular_z:
    type: float
    default: 0.50
    range: [0.0, null]
    unit: rad/s
    description: 键盘角速度上限；档案校验要求不超过 adapter 硬限
  teleop.publish_hz:
    type: float
    default: 20.0
    unit: Hz
    description: 键盘轮询/发布频率，延续旧节点最低 1 Hz 的语义
  teleop.key_timeout_sec:
    type: float
    default: 0.40
    unit: s
    description: 单调时间下按键静默超过阈值后零速；非正值关闭，节点 key_timeout

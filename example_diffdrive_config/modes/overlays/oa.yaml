# navrun up --OA 的可移植性参考件。
#
# 示例机器人同样只使用一个标准 PointCloud2 障碍源；真实机器人必须用自己的
# 点云话题、传感器 frame 和相对于 local costmap global frame 的高度窗口。
schema_version: 1
mode: oa
description: 使用实时 PointCloud2 的标准局部障碍层

nav2_overrides:
  local_costmap/local_costmap/ros__parameters/plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
  local_costmap/local_costmap/ros__parameters/obstacle_layer:
    observation_sources: realtime_cloud
    realtime_cloud:
      topic: /demo/lidar_points
      sensor_frame: demo_axle
      data_type: PointCloud2
      marking: true
      clearing: true
      min_obstacle_height: -0.5
      max_obstacle_height: 0.5
      obstacle_min_range: 0.2
      obstacle_max_range: 2.5
      raytrace_min_range: 0.2
      raytrace_max_range: 3.0

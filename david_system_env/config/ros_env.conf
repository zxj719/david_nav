#
# 格式必须是纯 KEY=value（无 export、无引号、无两侧空格），这样 bash 和 systemd
# 都能直接读：
#   - bash    : 经 config/load_ros_env.sh 被各启动脚本 source
#   - systemd : foxglove-bridge.service / launch-manager.service 的 EnvironmentFile=
#   - operator_console launch_manager : 子脚本继承（profiles.yaml 不再写 domain）
#
# 注意：lightning loc / wheeltec 底盘 / 机械臂 SDK 必须同在此 domain，否则
#      map→odom TF 串不起来（见 CLAUDE.md §5 的经典坑）。这些进程不在本 workspace，
#      需各自保证用同一个 ROS_DOMAIN_ID。
# ──────────────────────────────────────────────────────────────────────────

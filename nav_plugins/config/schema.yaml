# Profile frame keys are owned by nav_bringup; no duplicate declarations here.
schema_version: 1
package: nav_plugins
parameters:
  reactive.escape.longitudinal_speed:
    type: float
    unit: m/s
    required: true
    range: [0.0, null]
    description: 既有嵌入脱困纵向速度；与普通导航限速分别保留，策略重设计见 TODO-E1
  reactive.escape.lateral_speed:
    type: float
    unit: m/s
    required: true
    range: [0.0, null]
    description: 既有横向脱困速度；差速底盘只告警不启用新策略，TODO-E1
  reactive.embedded_backup.distance:
    type: float
    unit: m
    required: true
    range: [0.0, null]
    description: 嵌入恢复第二级后退距离
  reactive.embedded_backup.speed:
    type: float
    unit: m/s
    required: true
    range: [0.0, null]
    description: 嵌入恢复第二级后退速度，保持既有值
  reactive.recovery.backup_distance:
    type: float
    unit: m
    required: true
    range: [0.0, null]
    description: 普通恢复分支后退距离
  reactive.recovery.backup_speed:
    type: float
    unit: m/s
    required: true
    range: [0.0, null]
    description: 普通恢复分支后退速度
  reactive.recovery.spin_distance:
    type: float
    unit: rad
    required: true
    range: [0.0, null]
    description: 普通恢复分支旋转角度
  reactive.recovery.passed_goal_radius:
    type: float
    unit: m
    required: true
    range: [0.0, null]
    description: 多目标导航移除已通过目标的距离阈值
